<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calcbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: engineering-pad index on the left, one open calculator "sheet" on the right; stacks sheet-first on phones */
:root{
  --paper:#EBF0EC; --panel:#FAFCFA; --ink:#16212B; --muted:#56646C; --line:#CFD8D2;
  --accent:#1E4DB5; --accent-ink:#FFFFFF; --soft:#DCE5F7; --mark:#F2C230; --grid:rgba(30,77,181,.07); --err:#B3261E;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1418; --panel:#161F25; --ink:#E2E9E5; --muted:#93A2A9; --line:#29353C;
  --accent:#86A8FF; --accent-ink:#0A1530; --soft:#1E2A44; --mark:#C99A10; --grid:rgba(134,168,255,.06); --err:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1418; --panel:#161F25; --ink:#E2E9E5; --muted:#93A2A9; --line:#29353C;
  --accent:#86A8FF; --accent-ink:#0A1530; --soft:#1E2A44; --mark:#C99A10; --grid:rgba(134,168,255,.06); --err:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.top .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.brand{font:700 clamp(28px,5vw,40px)/1 var(--f-display);letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.tag{margin:6px 0 0;color:var(--muted);font-size:14px}
.search{flex:1 1 280px;max-width:420px;position:relative}
.search input{width:100%;font:inherit;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;gap:24px;padding-block:20px 40px}
@media (min-width:900px){
  .app{grid-template-columns:330px minmax(0,1fr);align-items:start}
  #index{order:-1;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:6px}
}
@media (max-width:899px){.searching #panel{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:500 12.5px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-weight:400;opacity:.6;margin-left:4px;font-family:var(--f-mono);font-size:11px}
.grp h2{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between}
.grp h2 span{font-family:var(--f-mono);letter-spacing:0}
.list{display:grid;gap:1px}
.item{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);padding:12px 0}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);display:grid;gap:22px}
.crumb{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
.sheet h1{font:700 clamp(26px,4vw,36px)/1.1 var(--f-display);letter-spacing:-.015em;margin:4px 0 6px;text-wrap:balance}
.desc{margin:0;color:var(--muted);max-width:62ch}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--paper);overflow:hidden}
.inbox:focus-within{border-color:var(--accent)}
.inbox input,.inbox select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--f-mono);padding:10px 12px;font-variant-numeric:tabular-nums}
.inbox input:focus,.inbox select:focus{outline:none}
.inbox select{font-family:var(--f-body);font-weight:400}
.unit{padding:0 12px;color:var(--muted);font:12px var(--f-mono);white-space:nowrap}
.results{border-top:1px dashed var(--line);padding-top:20px;display:grid;gap:14px}
.main-l{font-size:13px;color:var(--muted);margin:0 0 4px}
.main-v{font:500 clamp(30px,6vw,46px)/1.1 var(--f-mono);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.main-v mark{background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px}
.main-v small{font-size:.42em;color:var(--muted);margin-left:8px;letter-spacing:0}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 24px;margin:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row dt{color:var(--muted);font-size:13.5px}
.row dd{margin:0;font:500 14px var(--f-mono);text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.err{color:var(--err);margin:0;font-size:14px}
.how{background:var(--paper);border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.how h3{margin:0 0 4px;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.how code{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);white-space:pre-wrap}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.foot{color:var(--muted);font-size:12.5px;padding-block:0 30px}
@media (prefers-reduced-motion:no-preference){.results{animation:none}}
</style>

</head><body>
<header class="top"><div class="wrap">
  <div>
    <p class="brand">Calc<span>bench</span></p>
    <p class="tag" id="tag"></p>
  </div>
  <label class="search"><svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search calculators — try “mortgage” or “concrete”" aria-label="Search calculators" autocomplete="off">
  </label>
</div></header>

<div class="wrap app">
  <main id="panel" aria-live="polite"></main>
  <aside id="index" aria-label="All calculators"><div class="chips" id="chips"></div><div id="list"></div></aside>
</div>
<p class="wrap foot">An independent collection covering the same subjects as omnicalculator.com. Results are estimates for planning; check medical, financial and structural decisions with a professional.</p>

<script>
/* ---------- helpers ---------- */
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sci=(n,p=4)=>{const [m,e]=n.toExponential(p-1).split('e');return `${+m} × 10${String(+e).replace(/./g,c=>SUP[c]||c)}`};
const fx=(n,d=4)=>{if(typeof n!=='number'||!isFinite(n))return '—';const a=Math.abs(n);if(a!==0&&(a>=1e12||a<1e-4))return sci(n);return n.toLocaleString('en-US',{maximumFractionDigits:d})};
const $=n=>isFinite(n)?(n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const pc=(n,d=2)=>isFinite(n)?fx(n,d)+'%':'—';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);if(!y||!m||!d)throw 'Enter a full date.';return new Date(y,m-1,d)};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const days=(a,b)=>Math.round((b-a)/864e5);
const longD=d=>d.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const pt=s=>{const [h,m]=String(s).split(':').map(Number);if(isNaN(h)||isNaN(m))throw 'Enter a time.';return h*60+m};
const clock=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}:${pad(mm)} ${h<12?'AM':'PM'}`};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const fact=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))};
const ncdf=z=>.5*(1+erf(z/Math.SQRT2));
const ZC={80:1.2816,85:1.4395,90:1.6449,95:1.96,98:2.3263,99:2.5758,99.9:3.2905};
const need=(...xs)=>{if(xs.some(x=>typeof x!=='number'||!isFinite(x)))throw 'Fill in every field to see a result.'};

const N=(k,l,d,u)=>({k,l,d,u,t:'n'}), S=(k,l,o,d)=>({k,l,o,d:d??(Array.isArray(o[0])?o[0][0]:o[0]),t:'s'}),
      D=(k,l,d)=>({k,l,d,t:'d'}), TM=(k,l,d)=>({k,l,d,t:'tm'}), TX=(k,l,d,u)=>({k,l,d,u,t:'tx'});
const C=[]; const add=(c,id,n,s,i,f,m)=>C.push({c,id,n,s,i,f,m});

/* ---------- MATH ---------- */
add('Math','percentage','Percentage','Find a percentage of any number.',[N('p','Percent',15,'%'),N('x','Of value',240)],
 v=>{need(v.p,v.x);return [['Result',fx(v.p/100*v.x)],['Remaining',fx(v.x-v.p/100*v.x)],['As decimal',fx(v.p/100,6)]]},'result = P ÷ 100 × X');
add('Math','percent-of','What percent is X of Y','Express one number as a percentage of another.',[N('x','Value X',36),N('y','Total Y',48)],
 v=>{need(v.x,v.y);return [['X is this % of Y',pc(v.x/v.y*100,4)],['Ratio',fx(v.x/v.y,6)]]},'percent = X ÷ Y × 100');
add('Math','percentage-change','Percentage change','Increase or decrease between an old and a new value.',[N('a','Original value',80),N('b','New value',92)],
 v=>{need(v.a,v.b);const c=(v.b-v.a)/Math.abs(v.a)*100;return [[c>=0?'Increase':'Decrease',pc(Math.abs(c),4)],['Difference',fx(v.b-v.a)],['Percentage difference',pc(Math.abs(v.b-v.a)/((v.a+v.b)/2)*100)]]},'change = (new − old) ÷ |old| × 100');
add('Math','log','Logarithm','Log of a number in any base.',[N('x','Number',1000),N('b','Base',10)],
 v=>{need(v.x,v.b);if(v.x<=0||v.b<=0||v.b===1)throw 'Number and base must be positive; base cannot be 1.';return [['log',fx(Math.log(v.x)/Math.log(v.b),8)],['Natural log ln',fx(Math.log(v.x),8)],['log₂',fx(Math.log2(v.x),8)]]},'logₐ(x) = ln(x) ÷ ln(a)');
add('Math','exponent','Exponent','Raise a base to any power, including negatives and fractions.',[N('b','Base',2),N('e','Exponent',10)],
 v=>{need(v.b,v.e);return [['Result',fx(Math.pow(v.b,v.e),8)],['Reciprocal',fx(Math.pow(v.b,-v.e),8)]]},'result = bᵉ');
add('Math','root','Square & nth root','Square root, cube root, or any root.',[N('x','Number',729),N('n','Root',2)],
 v=>{need(v.x,v.n);if(v.x<0&&v.n%2!==1)throw 'Even roots of negative numbers are not real.';const r=Math.sign(v.x)*Math.pow(Math.abs(v.x),1/v.n);return [['Root',fx(r,10)],['Square root',v.x>=0?fx(Math.sqrt(v.x),10):'—'],['Cube root',fx(Math.cbrt(v.x),10)]]},'ⁿ√x = x^(1/n)');
add('Math','circle','Circle (circumference & area)','Diameter, circumference and area from a radius.',[N('r','Radius',5)],
 v=>{need(v.r);return [['Area',fx(Math.PI*v.r*v.r,6)],['Circumference',fx(2*Math.PI*v.r,6)],['Diameter',fx(2*v.r)]]},'C = 2πr · A = πr²');
add('Math','slope','Slope of a line','Slope, intercept and distance between two points.',[N('x1','x₁',1),N('y1','y₁',2),N('x2','x₂',5),N('y2','y₂',10)],
 v=>{need(v.x1,v.y1,v.x2,v.y2);const dx=v.x2-v.x1,dy=v.y2-v.y1;if(dx===0)return [['Slope','undefined (vertical)'],['Line','x = '+fx(v.x1)],['Distance',fx(Math.abs(dy))]];const m=dy/dx,b=v.y1-m*v.x1;return [['Slope m',fx(m,6)],['y-intercept b',fx(b,6)],['Equation',`y = ${fx(m,4)}x ${b<0?'−':'+'} ${fx(Math.abs(b),4)}`],['Angle',fx(Math.atan(m)*180/Math.PI,3)+'°'],['Distance',fx(Math.hypot(dx,dy),6)]]},'m = (y₂ − y₁) ÷ (x₂ − x₁)');
add('Math','pythagorean','Pythagorean theorem','Hypotenuse of a right triangle from its two legs.',[N('a','Leg a',3),N('b','Leg b',4)],
 v=>{need(v.a,v.b);const c=Math.hypot(v.a,v.b);return [['Hypotenuse c',fx(c,6)],['Area',fx(v.a*v.b/2,6)],['Angle α',fx(Math.atan(v.a/v.b)*180/Math.PI,3)+'°'],['Angle β',fx(Math.atan(v.b/v.a)*180/Math.PI,3)+'°']]},'c = √(a² + b²)');
add('Math','quadratic','Quadratic equation','Solve ax² + bx + c = 0, including complex roots.',[N('a','a',1),N('b','b',-3),N('c','c',-10)],
 v=>{need(v.a,v.b,v.c);if(v.a===0)throw 'a cannot be 0.';const d=v.b*v.b-4*v.a*v.c,h=-v.b/(2*v.a);let r;if(d>=0){const s=Math.sqrt(d)/(2*v.a);r=[['Roots',`${fx(h+s,6)}, ${fx(h-s,6)}`]]}else{const s=Math.sqrt(-d)/(2*Math.abs(v.a));r=[['Roots',`${fx(h,6)} ± ${fx(s,6)}i`]]}return r.concat([['Discriminant',fx(d)],['Vertex',`(${fx(h,4)}, ${fx(v.c-v.b*v.b/(4*v.a),4)})`]])},'x = (−b ± √(b² − 4ac)) ÷ 2a');
add('Math','scientific-notation','Scientific notation','Convert a decimal to scientific, E and engineering notation.',[TX('x','Number','0.000045600')],
 v=>{const x=Number(String(v.x).replace(/,/g,''));if(!isFinite(x)||x===0)throw 'Enter a non-zero number.';const e=Math.floor(Math.log10(Math.abs(x))),m=x/10**e,ee=Math.floor(e/3)*3;return [['Scientific',`${+m.toPrecision(10)} × 10${String(e).replace(/./g,c=>SUP[c])}`],['E notation',`${+m.toPrecision(10)}e${e}`],['Engineering',`${+(x/10**ee).toPrecision(10)} × 10${String(ee).replace(/./g,c=>SUP[c])}`]]},'x = a × 10ⁿ, 1 ≤ |a| < 10');
add('Math','sig-fig','Significant figures','Count significant figures and round to any number of them.',[TX('x','Number','0.004050'),N('n','Round to (sig figs)',2)],
 v=>{let s=String(v.x).trim().replace(/^[+-]/,'');const mant=s.split(/e/i)[0];if(!/^\d*\.?\d*$/.test(mant)||!/\d/.test(mant))throw 'Enter a plain number like 0.00405 or 1.20e3.';let cnt;if(mant.includes('.')||/e/i.test(s))cnt=mant.replace('.','').replace(/^0+/,'').length||1;else cnt=mant.replace(/^0+/,'').replace(/0+$/,'').length||1;const x=Number(String(v.x).trim());const n=Math.max(1,Math.min(21,Math.round(v.n||1)));return [['Significant figures',String(cnt)],['Rounded',Number(x).toPrecision(n)],['Decimal places',String((mant.split('.')[1]||'').length)]]},'Leading zeros never count; trailing zeros count only after a decimal point.');
add('Math','fraction','Simplify a fraction','Reduce a fraction and show it as a decimal and mixed number.',[N('a','Numerator',84),N('b','Denominator',36)],
 v=>{need(v.a,v.b);if(v.b===0)throw 'Denominator cannot be 0.';if(!Number.isInteger(v.a)||!Number.isInteger(v.b))throw 'Use whole numbers.';const g=gcd(v.a,v.b),n=v.a/g*Math.sign(v.b),d=Math.abs(v.b/g),w=Math.trunc(n/d),r=Math.abs(n%d);return [['Simplified',`${n}/${d}`],['Mixed number',r?`${w||''} ${r}/${d}`.trim():String(w)],['Decimal',fx(n/d,8)],['GCD used',String(g)]]},'divide top and bottom by gcd(a, b)');
add('Math','gcd-lcm','GCD & LCM','Greatest common divisor and least common multiple.',[N('a','First number',48),N('b','Second number',180)],
 v=>{need(v.a,v.b);const g=gcd(Math.round(v.a),Math.round(v.b));return [['GCD',fx(g)],['LCM',fx(Math.abs(v.a*v.b)/g)]]},'lcm(a,b) = |a·b| ÷ gcd(a,b)');
add('Math','triangle','Triangle area (3 sides)','Area and angles of any triangle from its sides.',[N('a','Side a',7),N('b','Side b',8),N('c','Side c',9)],
 v=>{need(v.a,v.b,v.c);const s=(v.a+v.b+v.c)/2,A2=s*(s-v.a)*(s-v.b)*(s-v.c);if(A2<=0)throw 'These sides cannot form a triangle.';const ang=(x,y,z)=>Math.acos((y*y+z*z-x*x)/(2*y*z))*180/Math.PI;return [['Area',fx(Math.sqrt(A2),6)],['Perimeter',fx(2*s)],['Angle A',fx(ang(v.a,v.b,v.c),3)+'°'],['Angle B',fx(ang(v.b,v.a,v.c),3)+'°'],['Angle C',fx(ang(v.c,v.a,v.b),3)+'°']]},"Heron's formula: A = √(s(s−a)(s−b)(s−c))");
add('Math','volume','Volume of shapes','Volume and surface area of common solids.',[S('s','Shape',[['cyl','Cylinder'],['sph','Sphere'],['cone','Cone'],['box','Rectangular box']]),N('a','Radius / length',3),N('b','Height',10),N('c','Width (box only)',4)],
 v=>{need(v.a);const r=v.a,h=v.b;if(v.s==='sph')return [['Volume',fx(4/3*Math.PI*r**3,6)],['Surface area',fx(4*Math.PI*r*r,6)]];need(h);if(v.s==='cyl')return [['Volume',fx(Math.PI*r*r*h,6)],['Surface area',fx(2*Math.PI*r*(r+h),6)]];if(v.s==='cone')return [['Volume',fx(Math.PI*r*r*h/3,6)],['Surface area',fx(Math.PI*r*(r+Math.hypot(r,h)),6)]];need(v.c);return [['Volume',fx(r*h*v.c,6)],['Surface area',fx(2*(r*h+r*v.c+h*v.c),6)]]},'cylinder πr²h · sphere ⁴⁄₃πr³ · cone ⅓πr²h');
add('Math','factorial','Factorial','n! for whole numbers up to 170.',[N('n','n',12)],
 v=>{need(v.n);if(v.n<0||!Number.isInteger(v.n)||v.n>170)throw 'Use a whole number from 0 to 170.';const f=fact(v.n);return [['n!',f<1e15?f.toLocaleString('en-US'):sci(f,8)],['Digits',String(Math.floor(Math.log10(f))+1)]]},'n! = 1 × 2 × … × n');
add('Math','ratio','Ratio (solve for D)','Scale a ratio A : B = C : D.',[N('a','A',3),N('b','B',4),N('c','C',15)],
 v=>{need(v.a,v.b,v.c);const g=gcd(v.a,v.b);return [['D',fx(v.b*v.c/v.a,6)],['Simplified A:B',Number.isInteger(v.a)&&Number.isInteger(v.b)?`${v.a/g} : ${v.b/g}`:'—'],['Scale factor',fx(v.c/v.a,6)]]},'D = B × C ÷ A');

/* ---------- FINANCE ---------- */
const amort=(P,apr,n)=>{const r=apr/100/12;return r?P*r/(1-(1+r)**-n):P/n};
add('Finance','loan','Loan payment','Monthly payment and total interest on a fixed-rate loan.',[N('p','Loan amount',25000,'$'),N('r','Interest rate',7.5,'% APR'),N('y','Term',5,'years')],

 v=>{need(v.p,v.c,v.r,v.y);const k=+v.n,m=(1+v.r/100/k)**(k/12)-1;let b=v.p;const M=Math.round(v.y*12);for(let i=0;i<M;i++)b=b*(1+m)+v.c;const dep=v.p+v.c*M;return [['Future value',$(b)],['Total deposited',$(dep)],['Interest earned',$(b-dep)],['Effective annual rate',pc(((1+v.r/100/k)**k-1)*100,3)]]},'A = P(1 + r/n)^(nt), with deposits added each month');

function formula(s){s=s.replace(/\s/g,'');let i=0;const num=()=>{let d='';while(/\d/.test(s[i]||''))d+=s[i++];return d?+d:1};
 const grp=()=>{const m={};while(i<s.length){const ch=s[i];if(ch==='('||ch==='['){i++;const g=grp();if(s[i]!==')'&&s[i]!==']')throw 'Unmatched bracket.';i++;const n=num();for(const k in g)m[k]=(m[k]||0)+g[k]*n}else if(ch===')'||ch===']')return m;else if(/[A-Z]/.test(ch)){let e=ch;i++;while(/[a-z]/.test(s[i]||''))e+=s[i++];if(!(e in AM))throw `Element “${e}” isn’t in this table.`;const n=num();m[e]=(m[e]||0)+n}else throw `Unexpected “${ch}”.`}return m};
 const r=grp();if(i<s.length)throw 'Unmatched bracket.';return r}

add('Food','macro-calories','Calories from macros','Calories from protein, carbs and fat.',[N('p','Protein',30,'g'),N('c','Carbohydrates',45,'g'),N('f','Fat',15,'g'),N('a','Alcohol',0,'g')],
 v=>{need(v.p,v.c,v.f,v.a);const P=v.p*4,Cc=v.c*4,F=v.f*9,A=v.a*7,t=P+Cc+F+A;return [['Calories',fx(t)+' kcal'],['Protein',pc(P/t*100,0)],['Carbs',pc(Cc/t*100,0)],['Fat',pc(F/t*100,0)]]},'4 kcal/g protein & carbs · 9 fat · 7 alcohol');

 v=>{need(v.q);const g=v.q*+v.i;return [['Weight',fx(g,1)+' g'],['Ounces',fx(g/28.3495,2)+' oz']]},'typical scooped weights per US cup');

const RD=[['1','1 mile'],['3.10686','5K'],['6.21371','10K'],['13.1094','Half marathon'],['26.2188','Marathon']];
add('Sports','pace','Running pace','Pace per mile and kilometer from distance and time.',[N('d','Distance',3.10686),S('u','Unit',[['mi','miles'],['km','kilometers']]),N('h','Hours',0),N('m','Minutes',27),N('s','Seconds',30)],
 v=>{need(v.d,v.h,v.m,v.s);const t=v.h*3600+v.m*60+v.s,mi=v.u==='mi'?v.d:v.d/1.609344;return [['Pace per mile',hms(t/mi)],['Pace per km',hms(t/(mi*1.609344))],['Speed',fx(mi/(t/3600),2)+' mph'],['Total time',hms(t)]]},'pace = time ÷ distance');
add('Sports','race-predictor','Race time predictor','Predict a race time from a recent result.',[S('a','Recent race',RD,'3.10686'),N('h','Hours',0),N('m','Minutes',27),N('s','Seconds',30),S('b','Goal race',RD,'13.1094')],
 v=>{need(v.h,v.m,v.s);const t=(v.h*3600+v.m*60+v.s)*(+v.b/+v.a)**1.06;return [['Predicted time',hms(t)],['Pace per mile',hms(t/+v.b)]]},"Riegel: T₂ = T₁ × (D₂ ÷ D₁)^1.06");
add('Sports','calories-burned','Calories burned','Energy burned during an activity (MET method).',[S('a','Activity',[['3.5','Walking, 3 mph'],['5','Walking, 4 mph brisk'],['9.8','Running, 6 mph'],['11.8','Running, 8 mph'],['8','Cycling, 12–14 mph'],['7','Swimming laps'],['6','Hiking'],['3.5','Weight lifting'],['2.5','Yoga'],['8','Basketball'],['4.8','Golf, carrying clubs'],['5.5','Mowing lawn']]),N('w','Weight',170,'lb'),N('t','Duration',45,'min')],
 v=>{need(v.w,v.t);const k=+v.a*3.5*v.w*.45359237/200*v.t;return [['Calories burned',fx(Math.round(k))+' kcal'],['Per hour',fx(Math.round(k/v.t*60))+' kcal']]},'kcal = MET × 3.5 × kg ÷ 200 × minutes');
add('Sports','one-rep-max','One-rep max','Estimate your 1RM and training loads.',[N('w','Weight lifted',185,'lb'),N('r','Reps',6)],
 v=>{need(v.w,v.r);if(v.r<1||v.r>15)throw 'Use 1–15 reps for a sensible estimate.';const e=v.w*(1+v.r/30),b=v.w*36/(37-v.r),m=(e+b)/2;return [['Estimated 1RM',fx(Math.round(m))+' lb'],['Epley',fx(e,1)],['Brzycki',fx(b,1)],['85% (≈5 reps)',fx(Math.round(m*.85))],['75% (≈10 reps)',fx(Math.round(m*.75))]]},'Epley: w(1 + r/30) · Brzycki: w × 36/(37 − r)');
add('Sports','era','ERA (baseball)','Earned run average for a pitcher.',[N('er','Earned runs',42),N('ip','Innings pitched',150.2,'.1 = ⅓')],
 v=>{need(v.er,v.ip);const w=Math.floor(v.ip),f=Math.round((v.ip-w)*10),ip=w+f/3;return [['ERA',(v.er*9/ip).toFixed(2)],['Innings (decimal)',fx(ip,3)]]},'ERA = 9 × ER ÷ IP');
add('Sports','batting-average','Batting average & OBP','Batting average and on-base percentage.',[N('h','Hits',152),N('ab','At-bats',510),N('bb','Walks',60),N('hbp','Hit by pitch',4),N('sf','Sacrifice flies',5)],
 v=>{need(v.h,v.ab,v.bb,v.hbp,v.sf);const f=x=>x.toFixed(3).replace(/^0/,'');return [['Batting average',f(v.h/v.ab)],['On-base %',f((v.h+v.bb+v.hbp)/(v.ab+v.bb+v.hbp+v.sf))]]},'AVG = H ÷ AB · OBP = (H+BB+HBP) ÷ (AB+BB+HBP+SF)');

/* ---------- BIOLOGY ---------- */
add('Biology','dog-age','Dog age in human years','Size-adjusted dog age.',[N('a','Dog’s age',6,'years'),S('s','Size',[['5','Medium (21–50 lb)'],['4','Small (≤ 20 lb)'],['6','Large (51–100 lb)'],['7.5','Giant (100+ lb)']])],
 v=>{need(v.a);const h=v.a<=1?v.a*15:v.a<=2?15+(v.a-1)*9:24+(v.a-2)*+v.s;return [['Human years',fx(Math.round(h))],['Life stage',v.a<1?'Puppy':v.a<3?'Young adult':v.a<(+v.s>5?6:8)?'Adult':'Senior']]},'15 for year one, +9 for year two, then +4–7.5 per year by size');
add('Biology','population-growth','Exponential growth','Population after a number of doublings.',[N('n','Starting count',1000),N('d','Doubling time',20,'min'),N('t','Elapsed time',180,'min')],
 v=>{need(v.n,v.d,v.t);const g=v.t/v.d;return [['Final count',fx(v.n*2**g)],['Generations',fx(g,3)],['Growth rate k',fx(Math.LN2/v.d,6)+' /min']]},'N = N₀ × 2^(t/Td)');
add('Biology','dna-concentration','Nucleic acid concentration','Concentration from A260 absorbance.',[N('a','A260 reading',.45),N('d','Dilution factor',10),S('t','Sample',[['50','dsDNA'],['40','RNA'],['33','ssDNA']]),N('r','A260/A280 (optional)',1.85)],
 v=>{need(v.a,v.d);const c=v.a*+v.t*v.d;return [['Concentration',fx(c,2)+' ng/µL'],['Purity',isFinite(v.r)?(v.r>=1.8&&v.r<=2.1?'Good (1.8–2.1)':'Check for protein or phenol contamination'):'—']]},'c = A260 × factor × dilution');
add('Biology','hardy-weinberg','Hardy–Weinberg','Allele and genotype frequencies from the recessive phenotype.',[N('q2','Recessive phenotype frequency (q²)',.09)],
 v=>{need(v.q2);if(v.q2<0||v.q2>1)throw 'Use a value from 0 to 1.';const q=Math.sqrt(v.q2),p=1-q;return [['p (dominant allele)',fx(p,4)],['q (recessive allele)',fx(q,4)],['p² homozygous dominant',pc(p*p*100)],['2pq carriers',pc(2*p*q*100)],['q² homozygous recessive',pc(v.q2*100)]]},'p² + 2pq + q² = 1');

add('Ecology','car-co2','Car CO₂ emissions','Yearly tailpipe CO₂ from your driving.',[N('m','Miles per year',12000),N('e','Fuel economy',28,'mpg')],
 v=>{need(v.m,v.e);const g=v.m/v.e,kg=g*8.887;return [['CO₂ per year',fx(kg/1000,2)+' metric tons'],['Gallons burned',fx(g,0)],['Per mile',fx(kg/v.m*1000,0)+' g']]},'8.887 kg CO₂ per gallon of gasoline (EPA)');

 v=>{need(v.a,v.r,v.e);const g=v.a*v.r*.623*v.e/100;return [['Water collected',fx(g,0)+' gal'],['Liters',fx(g*3.78541,0)],['55-gal barrels',fx(g/55,1)]]},'1 inch on 1 sq ft ≈ 0.623 gal');

 v=>{need(v.k,v.f);const t=v.k*12*v.f/1000;return [['CO₂ per year',fx(t,2)+' metric tons'],['Per month',fx(v.k*v.f,0)+' kg']]},'US average ≈ 0.37 kg CO₂/kWh; your utility may differ');

/* ---------- UI ---------- */
const CATS=[...new Set(C.map(c=>c.c))];
const byId=Object.fromEntries(C.map(c=>[c.id,c]));
const vals={};let cat='All';
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==='class')e.className=y;else if(x.startsWith('on'))e.addEventListener(x.slice(2),y);else e.setAttribute(x,y)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
document.getElementById('tag').textContent=`${C.length} working calculators across ${CATS.length} subjects`;
const q=document.getElementById('q');

function cur(){const h=location.hash.slice(1);return byId[h]?h:'percentage'}
function renderChips(){const box=document.getElementById('chips');box.replaceChildren(...['All',...CATS].map(c=>el('button',{class:'chip','aria-pressed':String(c===cat),onclick:()=>{cat=c;renderChips();renderList()}},c,el('b',{},String(c==='All'?C.length:C.filter(x=>x.c===c).length)))))}
function renderList(){const s=q.value.trim().toLowerCase(),id=cur();document.body.classList.toggle('searching',!!s);
 const hit=C.filter(c=>(cat==='All'||c.c===cat)&&(!s||(c.n+' '+c.s+' '+c.c+' '+c.id).toLowerCase().includes(s)));
 const box=document.getElementById('list');if(!hit.length){box.replaceChildren(el('p',{class:'empty'},`No calculator matches “${q.value}”.`));return}
 box.replaceChildren(...CATS.filter(k=>hit.some(c=>c.c===k)).map(k=>{const items=hit.filter(c=>c.c===k);return el('section',{class:'grp'},el('h2',{},k,el('span',{},String(items.length))),el('div',{class:'list'},items.map(c=>el('a',{class:'item',href:'#'+c.id,'aria-current':String(c.id===id),onclick:()=>{q.value='';document.body.classList.remove('searching')}},c.n))))}))}
function compute(c,box){const v=vals[c.id];const pv={};c.i.forEach(f=>{pv[f.k]=f.t==='n'?(v[f.k]===''?NaN:Number(v[f.k])):v[f.k]});
 try{const r=c.f(pv);const[m,...rest]=r;box.replaceChildren(el('div',{},el('p',{class:'main-l'},m[0]),el('p',{class:'main-v'},el('mark',{},m[1]))),rest.length?el('dl',{class:'rows'},rest.map(x=>el('div',{class:'row'},el('dt',{},x[0]),el('dd',{},x[1])))):null)}
 catch(e){box.replaceChildren(el('p',{class:'err'},typeof e==='string'?e:'Check the inputs — something can’t be calculated.'))}}
function renderPanel(){const c=byId[cur()];document.title=c.n+' · Calcbench';if(!vals[c.id])vals[c.id]=Object.fromEntries(c.i.map(f=>[f.k,String(f.d)]));const v=vals[c.id];
 const res=el('div',{class:'results'});
 const fields=c.i.map(f=>{const id=`${c.id}-${f.k}`;let inp;
  if(f.t==='s')inp=el('select',{id},f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];const op=el('option',{value:val},lab);if(String(val)===v[f.k])op.selected=true;return op}));
  else{inp=el('input',{id,type:f.t==='d'?'date':f.t==='tm'?'time':f.t==='tx'?'text':'number',...(f.t==='n'?{step:'any',inputmode:'decimal'}:{}),spellcheck:'false'});inp.value=v[f.k]}
  inp.addEventListener('input',()=>{v[f.k]=inp.value;compute(c,res)});inp.addEventListener('change',()=>{v[f.k]=inp.value;compute(c,res)});
  return el('div',{class:'field'},el('label',{for:id},f.l),el('div',{class:'inbox'},inp,f.u&&f.t!=='s'?el('span',{class:'unit'},f.u):null))});
 const reset=el('button',{class:'btn',type:'button',onclick:()=>{delete vals[c.id];renderPanel()}},'Reset to example');
 document.getElementById('panel').replaceChildren(el('article',{class:'sheet'},
  el('header',{},el('p',{class:'crumb'},c.c),el('h1',{},c.n),el('p',{class:'desc'},c.s)),
  el('form',{class:'fields',onsubmit:e=>e.preventDefault()},fields),res,
  el('div',{class:'how'},el('h3',{},'How it’s figured'),el('code',{},c.m)),el('div',{class:'bar'},reset)));
 compute(c,res)}
function route(){renderPanel();renderList();if(matchMedia('(max-width:899px)').matches&&location.hash)document.getElementById('panel').scrollIntoView({block:'start'})}
q.addEventListener('input',renderList);
window.addEventListener('hashchange',route);
renderChips();renderPanel();renderList();
</script>
