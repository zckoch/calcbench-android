name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Load signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS under Settings > Secrets and variables > Actions. No release was published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf %s "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.p12" || echo "::error::KEYSTORE_BASE64 is not valid base64. Paste the whole line again."
            echo "::notice::keystore bytes=$(stat -c%s "$RUNNER_TEMP/release.p12") (expected 2574) sha256-match=$([ "$(sha256sum "$RUNNER_TEMP/release.p12" | cut -d' ' -f1)" = "3ef1dc1a5ca1eb73709d7034f9f3f0f2ec96b810def7a10bf8730df62d4e4b81" ] && echo yes || echo no)"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check signing key
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_PASSWORD="$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"; KEY_ALIAS="$(printf %s "$KEY_ALIAS" | tr -d '[:space:]')"; export KEYSTORE_PASSWORD KEY_ALIAS
          if keytool -list -keystore "$KEYSTORE_FILE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-calcbench}" > /dev/null 2> err.txt; then
            echo "::notice::Signing key opened with the password and alias."
          else
            echo "::error::Signing key check failed: $(grep -v JAVA_TOOL err.txt | head -2 | tr '\n' ' ')"
          fi
      - name: Build
        run: |
          set -o pipefail
          KEYSTORE_PASSWORD="$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"; KEY_ALIAS="$(printf %s "$KEY_ALIAS" | tr -d '[:space:]')"; export KEYSTORE_PASSWORD KEY_ALIAS
          gradle assembleRelease --no-daemon 2>&1 | tee gradle.log || { awk '/What went wrong/{f=1} f&&NF{print} /Try:/{exit}' gradle.log | head -8 | sed 's/^/::error::/' ; exit 1; }
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - run: cp app/build/outputs/apk/release/app-release.apk Calcbench.apk
      - name: Check signature
        if: steps.key.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs Calcbench.apk | grep -i sha-256
      - uses: actions/upload-artifact@v4
        with:
          name: Calcbench-apk
          path: Calcbench.apk
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.signed == 'true'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Calcbench 1.0 (build ${{ github.run_number }})
          body: Download Calcbench.apk below and open it on your Android phone to install.
          files: Calcbench.apk
